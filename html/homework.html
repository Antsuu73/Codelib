<!DOCTYPE html>
<html lang="en">
<head>

  <meta charset="UTF-8">

  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>
    CodeLib Homework
  </title>

  <!-- GOOGLE FONT -->

  <link
    href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap"
    rel="stylesheet"
  >

  <!-- BOOTSTRAP -->

  <link
    href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css"
    rel="stylesheet"
  >

  <!-- ICON -->

  <link
    rel="stylesheet"
    href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/bootstrap-icons.min.css"
  >

  <!-- CSS -->

  <link
    rel="stylesheet"
    href="../css/homework.css"
  >

  <script src="../js/auth.js"></script>

</head>

<body>

  <!-- NAVBAR -->

  <nav class="navbar navbar-expand-lg cl-navbar">

  <div class="container-fluid">

    <a class="navbar-brand cl-logo" href="#">

      <span>CodeLib</span>

    </a>

    <button
      class="navbar-toggler cl-menu-btn"
      type="button"
      data-bs-toggle="collapse"
      data-bs-target="#mainNavbar"
    >
      <i class="bi bi-list"></i>
    </button>

    <div class="collapse navbar-collapse" id="mainNavbar">

      <ul class="navbar-nav mx-auto cl-nav">

        <li class="nav-item">
          <a class="nav-link " href="../index.html">
            <i class="bi bi-house-door"></i>
            Home
          </a>
        </li>

        <li class="nav-item">
          <a class="nav-link" href="timeline.html">
            <i class="bi bi-diagram-3"></i>
            Roadmap
          </a>
        </li>        

        <li class="nav-item">
          <a class="nav-link" href="knowledge.html">
            <i class="bi bi-book"></i>
            Learn
          </a>
        </li>

        <li class="nav-item">
          <a class="nav-link active" href="homework.html">
            <i class="bi bi-journal-code"></i>
            Problems
          </a>
        </li>

        <li class="nav-item">
          <a class="nav-link" href="editor.html">
            <i class="bi bi-code-slash"></i>
            Editor
          </a>
        </li>

        <li class="nav-item">
          <a class="nav-link " href="notes.html">
            <i class="bi bi-journal-text"></i>
            Notes
          </a>
        </li>

      </ul>

      <div class="d-flex align-items-center gap-3">

        <div class="cl-search">

          <i class="bi bi-search"></i>

          <input
            type="text"
            placeholder="Search..."
          >

        </div>

      </div>
        <button class="cl-login-btn">

          <i class="bi bi-box-arrow-in-right"></i>
          <a class="nav-link" href="login.html">Login</a>

        </button>
    </div>

  </div>

</nav>

  <!-- TOPBAR -->

  <div class="cl-topbar">

    <button class="cl-topic-btn active">
      Tổng Hợp
    </button>

    <button class="cl-topic-btn">
      Mảng 2 Chiều
    </button>

    <button class="cl-topic-btn">
      Vector
    </button>

    <button class="cl-topic-btn">
     String
    </button>

    <button class="cl-topic-btn">
      Đệ Quy
    </button>

    <button class="cl-topic-btn">
      Tìm kiếm nhị phân
    </button>
  
    <button class="cl-topic-btn">
      Vòng lặp
    </button>

    <button class="cl-topic-btn">
      Tham khảo
    </button>
  </div>

  <!-- MAIN -->

  <section class="cl-practice-layout">

    <!-- SIDEBAR -->

    <aside class="cl-problem-sidebar">

      <h3>
        Homework Problems
      </h3>

      <ul>

      </ul>

    </aside>

    <!-- CONTENT -->

    <main class="cl-problem-content">

      <div class="cl-problem-top">

        <h1>
          Homework
        </h1>

        <span class="easy">
          Easy
        </span>

      </div>

      <div class="cl-problem-body">

      </div>

    </main>

    <!-- EDITOR -->

    <aside class="cl-code-panel">

      <div class="cl-code-top">

        <select>

          <option>
            Python
          </option>

          <option>
            Pascal
          </option>

          <option>
            C++
          </option>

        </select>

        <button>
          Submit
        </button>

      </div>

      <textarea
        spellcheck="false"
        placeholder="Write your code here..."
      ></textarea>

    </aside>

  </section>

  <!-- BOOTSTRAP JS -->

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"></script>

  <!-- JS -->

  <script src="../js/homework.js"></script>

</body>
</html>
