<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>CodeLib Login</title>

  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/bootstrap-icons.min.css">
  <link rel="stylesheet" href="../css/auth.css">
</head>

<body>

<section class="cl-auth-section">
  <div class="container">
    <div class="row justify-content-center">
      <div class="col-lg-5">

        <div class="cl-auth-card">

          <div class="cl-auth-top">
            <div class="cl-auth-logo">
              <i class="bi bi-code-slash"></i>
            </div>
            <h2>Login</h2>
            <p>Welcome back to CodeLib</p>
          </div>

          <form id="loginForm">

            <div class="cl-input-box">
              <label>Email</label>
              <input type="email" id="email" placeholder="Enter email">
            </div>

            <div class="cl-input-box">
              <label>Password</label>
              <input type="password" id="password" placeholder="Enter password">
            </div>

            <button type="submit" class="cl-auth-btn" id="loginBtn">
              <i class="bi bi-box-arrow-in-right"></i>
              Login
            </button>

          </form>

          <div class="cl-auth-link">
            Don't have account?
            <a href="register.html">Register</a>
          </div>

        </div>

      </div>
    </div>
  </div>
</section>

  <script>
const form = document.getElementById("loginForm");

form.addEventListener("submit", function(e) {
  e.preventDefault();

  const email    = document.getElementById("email").value.trim();
  const password = document.getElementById("password").value.trim();

  // Bắt lỗi
  if (!email || !password) {
    alert("Vui lòng nhập đủ email và mật khẩu!");
    return;
  }

  if (password.length < 6) {
    alert("Mật khẩu phải có ít nhất 6 ký tự!");
    return;
  }

  // Kiểm tra tài khoản
  const user = JSON.parse(localStorage.getItem("codelibUser") || "null");

  if (!user || user.email !== email || user.password !== password) {
    alert("Email hoặc mật khẩu không đúng!");
    return;
  }

  // Lưu trạng thái đăng nhập
  localStorage.setItem("isLoggedIn", "true");
  localStorage.setItem("currentUser", email);

  window.location.href = "index.html";
});
</script>


</body>
</html>
