<!DOCTYPE html>
<html lang="en">
<head>

  <meta charset="UTF-8">

  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>CodeLib Editor</title>

  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">

  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">

  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/bootstrap-icons.min.css">

  <link rel="stylesheet" href="/css/editor.css">

  <script src="/js/auth.js"></script>

</head>

<body>
<nav class="navbar navbar-expand-lg cl-navbar">

  <div class="container-fluid">

    <!-- LOGO -->
    <a class="navbar-brand cl-logo" href="../main/main.html">
      <i class="bi bi-code-slash"></i>
      <span>CodeLib Editor</span>
    </a>

    <!-- TOGGLE (mobile) -->
    <button
      class="navbar-toggler cl-menu-btn"
      type="button"
      data-bs-toggle="collapse"
      data-bs-target="#editorNavbar"
    >
      <i class="bi bi-list"></i>
    </button>

    <div class="collapse navbar-collapse" id="editorNavbar">

      <!-- NAV LINKS -->
      <ul class="navbar-nav mx-auto cl-nav">

        <li class="nav-item">
          <a class="nav-link" href="index.html">
            <i class="bi bi-house-door"></i>
            Home
          </a>
        </li>

        <li class="nav-item">
          <a class="nav-link" href="timeline.html">
            <i class="bi bi-diagram-3"></i>
            Roadmap
          </a>
        </li>

        <li class="nav-item">
          <a class="nav-link" href="knowledge.html">
            <i class="bi bi-book"></i>
            Learn
          </a>
        </li>

        <li class="nav-item">
          <a class="nav-link" href="homework.html">
            <i class="bi bi-journal-code"></i>
            Problems
          </a>
        </li>


        <li class="nav-item">
          <a class="nav-link active" href="editor.html">
            <i class="bi bi-code-slash"></i>
            Editor
          </a>
        </li>

        <li class="nav-item">
          <a class="nav-link " href="notes.html">
            <i class="bi bi-journal-text"></i>
            Notes
          </a>
        </li>

      </ul>

      <!-- RIGHT: RUN + LOGIN -->
      <div class="d-flex align-items-center gap-3">

        <button class="cl-run-btn">
          <i class="bi bi-play-fill"></i>
          Run Code
        </button>

        <button class="cl-login-btn">

          <i class="bi bi-box-arrow-in-right"></i>
          <a class="nav-link" href="login.html">Login</a>

        </button>
      </div>

    </div>

  </div>

</nav>

  <section class="cl-editor-section">

    <!-- LEFT -->

    <div class="cl-editor-panel">

      <div class="cl-panel-top">

        <span>
          Choose Language
        </span>

        <select id="languageSelect" class="cl-language-select">

          <option value="cpp">
            C++
          </option>

          <option value="python">
            Python
          </option>

          <option value="pascal">
            Pascal
          </option>

        </select>

      </div>

      <div id="editor"></div>

    </div>

    <!-- RIGHT -->

    <div class="cl-output-panel">

      <div class="cl-panel-top">

        <span>
          Output
        </span>

      </div>

      <div class="cl-output-box">

        <div class="cl-output-icon">

          <i class="bi bi-terminal"></i>

        </div>

        <h2>
          CodeLib Compiler
        </h2>

        <p>
          Chức năng này sẽ hoàn thiện trong tương lai vì đây chỉ là bản demo nhỏ nên mọi người thông cảm !
        </p>

      </div>

    </div>

  </section>

  <script src="https://cdn.jsdelivr.net/npm/monaco-editor@0.52.2/min/vs/loader.js"></script>

  <script src="/js/editor.js"></script>

</body>
</html>
